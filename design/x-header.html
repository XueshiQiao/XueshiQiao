<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Header 方案</title>
<style>
  :root {
    --page-bg: #1b1b1f; --page-fg: #e8e8ea; --page-muted: #9a9aa3; --card: #26262c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--page-fg);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  .page { max-width: 1560px; margin: 0 auto; padding: 28px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lead { color: var(--page-muted); margin: 0 0 18px; font-size: 14px; line-height: 1.6; }
  .toolbar { position: sticky; top: 0; z-index: 10; display: flex; gap: 18px; flex-wrap: wrap;
    padding: 10px 14px; background: rgba(27,27,31,.92); backdrop-filter: blur(8px);
    border: 1px solid #333; border-radius: 10px; margin-bottom: 26px; font-size: 14px; }
  .toolbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .variant { margin-bottom: 44px; }
  .variant h2 { font-size: 17px; margin: 0 0 4px; }
  .variant p { margin: 0 0 12px; color: var(--page-muted); font-size: 13.5px; }
  .frame { position: relative; width: 100%; aspect-ratio: 3 / 1; overflow: hidden; border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .frame > .banner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* ---------- 公共：横幅本体 1500×500，左侧 0–445px 保留空白 ---------- */
  .banner { width: 1500px; height: 500px; position: relative; overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; }
  .content { position: absolute; left: 445px; right: 30px; top: 38px; bottom: 38px; }
  .ic { position: relative; flex: none; }
  .ic img { width: 100%; height: 100%; display: block; }
  /* AnyDrag 的图标自带留边比别的少，视觉上偏大，单独缩一点 */
  .ic.tight img { width: 90%; height: 90%; margin: 5%; }
  /* 满版方形的图标（没有 macOS 自带的留边和圆角）统一缩到 macOS 图标网格 824/1024 并裁圆角 */
  .ic.bleed img { width: 80.5%; height: 80.5%; margin: 9.75%; border-radius: 22.5%;
    box-shadow: 0 2px 6px rgba(0,0,0,.18); }

  /* 叠加层：保留区 & 原图对照 */
  .guide { position: absolute; inset: 0 auto 0 0; width: 445px; z-index: 50; pointer-events: none; display: none;
    background: repeating-linear-gradient(135deg, rgba(255,60,60,.18) 0 10px, transparent 10px 20px);
    border-right: 2px dashed rgba(255,80,80,.9); }
  .guide span { position: absolute; left: 16px; top: 14px; color: #fff; font: 600 18px -apple-system;
    background: rgba(220,40,40,.85); padding: 3px 8px; border-radius: 5px; }
  .ghost { position: absolute; inset: 0; z-index: 49; pointer-events: none; display: none;
    background: url(original.png) 0 0 / 1500px 500px; opacity: .35; }
  body.show-guide .guide { display: block; }
  body.show-ghost .ghost { display: block; }

  /* ================= V1 极光壁纸 ================= */
  .v1 { background:
      radial-gradient(900px 600px at 15% 110%, #3a1aa8 0%, transparent 60%),
      radial-gradient(700px 500px at 55% -10%, #ff6fb5 0%, transparent 60%),
      radial-gradient(800px 600px at 100% 60%, #b23be0 0%, transparent 60%),
      linear-gradient(120deg, #5b2bd6, #a73bd8 45%, #e2559e 75%, #c447d6); }
  .v1 svg.waves { position: absolute; inset: 0; }
  .v1 .grid { display: grid; grid-template-columns: 1.12fr 1.05fr .83fr; grid-template-rows: repeat(3, 1fr); height: 100%; }
  .v1 .cell { display: flex; align-items: center; gap: 20px; }
  .v1 .ic { width: 86px; height: 86px; filter: drop-shadow(0 6px 14px rgba(40,0,80,.35)); }
  .v1 .name { color: #fff; font-size: 35px; font-weight: 500; letter-spacing: -.3px;
    text-shadow: 0 2px 10px rgba(50,0,90,.35); }
  .v1 .more .ph { width: 69px; height: 69px; margin: 8.5px; border: 3px dashed rgba(255,255,255,.75);
    border-radius: 18px; display: grid; place-items: center; color: rgba(255,255,255,.85); font-size: 34px; }
  .v1 .more .name { opacity: .85; }

  /* ================= V2 夜色玻璃 ================= */
  .v2 { background: #0a0d1c; }
  .v2 .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .v2 .card { position: absolute; inset: 0; display: flex; flex-direction: column; border-radius: 26px; padding: 26px 30px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 20px 50px rgba(0,0,0,.35); }
  .v2 .head { display: flex; justify-content: space-between; align-items: baseline; color: rgba(255,255,255,.55);
    font-size: 17px; letter-spacing: .3px; margin-bottom: 18px; }
  .v2 .head b { color: #fff; font-weight: 600; font-size: 21px; letter-spacing: 0; }
  .v2 .grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); column-gap: 14px; align-items: center; }
  .v2 .cell { display: flex; align-items: center; gap: 14px; }
  .v2 .ic { width: 78px; height: 78px; }
  .v2 .name { color: #fff; font-size: 22px; font-weight: 600; }
  .v2 .desc { white-space: nowrap; color: rgba(255,255,255,.55); font-size: 14.5px; margin-top: 4px; }

  /* ================= V3 暖白纸面 ================= */
  .v3 { background: #f4efe6; }
  .v3 .grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; }
  .v3 .rule { position: absolute; left: 445px; right: 30px; top: 92px; border-top: 1.5px solid #d9cfbf; }
  .v3 .head { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: baseline; }
  .v3 .head .t { font-family: "New York", "Songti SC", Georgia, serif; font-size: 34px; color: #1f1a14; font-weight: 600; }
  .v3 .head .t i { color: #d9622b; font-style: italic; }
  .v3 .head .u { font-size: 16px; color: #8a7d6c; letter-spacing: .5px; }
  .v3 .grid { position: absolute; left: 0; right: 0; top: 78px; bottom: 0;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
  .v3 .cell { display: flex; align-items: center; gap: 14px; }
  .v3 .ic { width: 82px; height: 82px; filter: drop-shadow(0 6px 10px rgba(90,60,20,.16)); }
  .v3 .name { color: #1f1a14; font-size: 23px; font-weight: 650; }
  .v3 .desc { color: #8a7d6c; font-size: 14.5px; margin-top: 4px; }

  /* ================= V4 终端 ================= */
  .v4 { background:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,
      radial-gradient(900px 500px at 85% 20%, #11301f 0%, transparent 70%),
      #0c1015;
    font-family: "SF Mono", "JetBrains Mono", Menlo, "PingFang SC", monospace; }
  .v4 .prompt { color: #8b949e; font-size: 20px; margin-bottom: 22px; }
  .v4 .prompt .p { color: #3fb950; } .v4 .prompt .c { color: #e6edf3; }
  .v4 .content { display: flex; flex-direction: column; }
  .v4 .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); align-items: center; }
  .v4 .todo .ph { width: 70px; height: 70px; border: 2px dashed #30363d; border-radius: 16px; display: grid; place-items: center; color: #3fb950; font-size: 30px; }
  .v4 .cell { display: flex; align-items: center; gap: 16px; }
  .v4 .ic { width: 70px; height: 70px; }
  .v4 .name { color: #e6edf3; font-size: 25px; font-weight: 600; }
  .v4 .desc { color: #6e7681; font-size: 15px; margin-top: 5px; }
  .v4 .cursor { display: inline-block; width: 13px; height: 24px; background: #3fb950; vertical-align: -4px; margin-left: 4px; }

  /* ================= V5 大图标展台 ================= */
  .v5 { background:
      radial-gradient(1100px 420px at 70% 120%, rgba(255,255,255,.55) 0%, transparent 60%),
      radial-gradient(700px 400px at 100% 0%, #7ee6ff 0%, transparent 60%),
      linear-gradient(160deg, #2d6bff 0%, #3f9bff 45%, #6fd3ff 100%); }
  .v5 .rays { position: absolute; inset: 0; opacity: .25;
    background: repeating-conic-gradient(from 200deg at 1000px -200px, rgba(255,255,255,.5) 0deg 3deg, transparent 3deg 9deg);
    mask-image: linear-gradient(#000, transparent 80%); -webkit-mask-image: linear-gradient(#000, transparent 80%); }
  .v5 .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); height: 100%; }
  .v5 .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .v5 .ic { width: 140px; height: 140px; filter: drop-shadow(0 14px 18px rgba(0,30,110,.35)); }
  .v5 .name { color: #fff; font-size: 22px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,40,120,.35); }

  /* ================= V2b 夜色玻璃·放大版 ================= */
  .v2b { background: #0a0d1c; }
  .v2b .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .v2b .card { position: absolute; inset: 0; display: flex; flex-direction: column; border-radius: 28px; padding: 24px 22px 20px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 20px 50px rgba(0,0,0,.35); }
  .v2b .head { margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; padding: 0 10px; }
  .v2b .head b { color: #fff; font-weight: 700; font-size: 29px; }
  .v2b .head span { color: rgba(255,255,255,.7); font-size: 23px; font-weight: 500; }
  .v2b .grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); align-items: center; }
  .v2b .cell { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .v2b .ic { width: 76px; height: 76px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
  .v2b .name { color: #fff; font-size: 29px; font-weight: 650; letter-spacing: -.3px; margin-top: 6px; line-height: 1.15; }
  .v2b .desc { color: rgba(255,255,255,.72); font-size: 20px; margin-top: 2px; white-space: nowrap; }

  /* ================= V4b 终端·放大版 ================= */
  .v4b { background:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,
      radial-gradient(900px 500px at 85% 20%, #11301f 0%, transparent 70%),
      #0c1015;
    font-family: "SF Mono", "JetBrains Mono", Menlo, "PingFang SC", monospace; }
  .v4b .content { display: flex; flex-direction: column; }
  .v4b .prompt { color: #8b949e; font-size: 27px; margin-bottom: 6px; }
  .v4b .prompt .p { color: #3fb950; } .v4b .prompt .c { color: #e6edf3; }
  .v4b .cursor { display: inline-block; width: 15px; height: 30px; background: #3fb950; vertical-align: -5px; margin-left: 4px; }
  .v4b .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); align-items: center; }
  .v4b .cell { display: flex; align-items: center; gap: 16px; }
  .v4b .ic { width: 80px; height: 80px; }
  .v4b .name { color: #e6edf3; font-size: 29px; font-weight: 700; }
  .v4b .desc { color: #8b949e; font-size: 19px; margin-top: 4px; white-space: nowrap; }
  .v4b .more .ph { width: 68px; height: 68px; margin: 6px; border: 2px dashed #3a414a; border-radius: 16px; display: grid; place-items: center; color: #3fb950; font-size: 32px; }
  .v4b .more .name { color: #8b949e; }

  /* ================= 在 X 上的实际大小 ================= */
  .xrow { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 30px; }
  .xmock { background: #fff; border-radius: 10px; overflow: hidden; padding-bottom: 8px; }
  .xmock .cap { color: #666; font-size: 12px; padding: 6px 10px; }
  .xmock .hb { position: relative; overflow: visible; }
  .xmock .hb .clip { position: relative; overflow: hidden; }
  .xmock .hb .banner { transform-origin: 0 0; }
  .xmock .av { position: absolute; border-radius: 50%; background: linear-gradient(160deg,#9fd29a,#3c7d4d 55%,#2b4f7a);
    border: 4px solid #fff; box-sizing: border-box; }
  .xmock .below { height: 70px; }

  /* ================= V1 的背景套到 V2b / V4b 上 ================= */
  .banner.v1bg { background:
      radial-gradient(900px 600px at 15% 110%, #3a1aa8 0%, transparent 60%),
      radial-gradient(700px 500px at 55% -10%, #ff6fb5 0%, transparent 60%),
      radial-gradient(800px 600px at 100% 60%, #b23be0 0%, transparent 60%),
      linear-gradient(120deg, #5b2bd6, #a73bd8 45%, #e2559e 75%, #c447d6); }
  .banner.v1bg svg.waves { position: absolute; inset: 0; }
  /* 玻璃卡片在亮紫底上要压暗一点，白字才看得清 */
  .v2c .card { background: rgba(40,8,90,.30); border-color: rgba(255,255,255,.22); }
  .v2c .head span { color: rgba(255,255,255,.8); }
  .v2c .desc { color: rgba(255,255,255,.82); }
  /* 终端配色在紫底上：灰字换成半透明白，绿色换成浅薄荷绿 */
  .v4c .prompt { color: rgba(255,255,255,.75); text-shadow: 0 2px 8px rgba(40,0,80,.35); }
  .v4c .prompt .p { color: #b8ffcf; } .v4c .prompt .c { color: #fff; }
  .v4c .cursor { background: #b8ffcf; }
  .v4c .name { color: #fff; text-shadow: 0 2px 8px rgba(40,0,80,.35); }
  .v4c .desc { color: rgba(255,255,255,.8); }
  .v4c .more .name { color: rgba(255,255,255,.8); }
  .v4c .more .ph { border-color: rgba(255,255,255,.6); color: #fff; }
</style>
</head>
<body>
<div class="page">
  <h1>X / Twitter 头图 · 方案与优化</h1>
  <p class="lead">尺寸都是 1500×500（和原图一样）。左侧 0–445px 全部留空，和原图里图标起点 445px 对齐，上下也和原图一样留 38px 左右的边。<br>
    打开下面的开关可以核对：红色斜线 = 左侧保留空白区（X 头像会压在这里）。</p>
  <div class="toolbar">
    <label><input type="checkbox" id="tg-guide"> 显示左侧保留区</label>
    <label>V2 标题：<select id="title-pick"></select></label>
  </div>
  <div id="list"></div>
</div>

<script>
const APPS = [
  { n: 'PastePaw',      d: '剪贴板历史',          i: 'pastepaw',      bleed: true },
  { n: 'QDuo',          d: '划词，一键动作',       i: 'qduo' },
  { n: 'AnyDrag',       d: '按住任意处拖动窗口',   i: 'anydrag', tight: true },
  { n: 'HyperCapslock', d: 'Caps Lock 变 Hyper 键', i: 'hypercapslock' },
  { n: 'netstat-cat',   d: '看清每条网络连接',     i: 'netstat-cat',   bleed: true },
  { n: 'CCSwitcher',    d: '切换 Claude Code 配置', i: 'ccswitcher' },
  { n: 'VaultPaw',      d: '给 AI 的密钥保险箱',   i: 'vaultpaw' },
  { n: 'Flowy',         d: '说话 → 文字 → 回填',   i: 'flowy',         bleed: true },
];

const SHORT = { PastePaw: '剪贴板历史', QDuo: '划词工具', AnyDrag: '任意处拖窗口', HyperCapslock: 'Caps 变 Hyper',
  'netstat-cat': '看网络连接', CCSwitcher: 'Claude 配置切换', VaultPaw: '给 AI 的密钥箱', Flowy: '语音转文字' };
const icon = a => `<div class="ic${a.bleed ? ' bleed' : ''}${a.tight ? ' tight' : ''}"><img src="icon-src/${a.i}.png" alt=""></div>`;

const TITLES = ['效率工具 for macOS', 'macOS 效率工具集', 'Mac 效率小工具', '让 Mac 更顺手的小工具', 'Little tools for a better Mac'];
let TITLE = new URLSearchParams(location.search).get('title') || TITLES[0];
const WAVES = `<svg class="waves" viewBox="0 0 1500 500" preserveAspectRatio="none">
        <path d="M0 300 C 250 200, 420 420, 700 330 S 1150 180, 1500 260 L1500 500 L0 500Z" fill="rgba(70,20,170,.35)"/>
        <path d="M0 380 C 300 300, 520 500, 820 410 S 1250 300, 1500 380 L1500 500 L0 500Z" fill="rgba(40,10,120,.35)"/>
        <path d="M520 0 C 640 120, 600 260, 760 360 S 1000 520, 1100 500 L1500 500 L1500 0Z" fill="rgba(255,190,230,.16)"/>
      </svg>`;
const V = [
  { id: 'v2c', cls: 'v2b v2c v1bg', title: 'V2c · 放大版玻璃卡片 + V1 背景（新）', note: 'V2b 的排版不动，背景换成 V1 的紫粉渐变和波浪；卡片压暗一点，白字才看得清。',
    html: () => WAVES + V.find(v => v.id === 'v2b').html().replace(/<div class="blob"[^>]*><\/div>/g, '') },
  { id: 'v4c', cls: 'v4b v4c v1bg', title: 'V4c · 放大版终端 + V1 背景（新）', note: 'V4b 的排版不动，背景换成 V1 的；终端的灰字和深绿色在紫底上看不清，换成了半透明白和浅薄荷绿。',
    html: () => WAVES + V.find(v => v.id === 'v4b').html() },

  { id: 'v2b', title: 'V2b · 夜色玻璃 · 放大版（新）', note: '名字 22→30px、说明 14.5→20px 并改短、图标放到名字上方居中，卡片里不再有大块空白；标题和 xueshi.dev 也放大。',
    html: () => `
      <div class="blob" style="left:520px;top:-120px;width:420px;height:320px;background:#4b3bff;opacity:.55"></div>
      <div class="blob" style="left:1050px;top:260px;width:460px;height:320px;background:#ff4f9a;opacity:.4"></div>
      <div class="blob" style="left:60px;top:300px;width:360px;height:260px;background:#1d6bff;opacity:.35"></div>
      <div class="content"><div class="card">
        <div class="head"><b>${TITLE}</b><span>xueshi.dev</span></div>
        <div class="grid">${APPS.map(a => `<div class="cell">${icon(a)}<div class="name">${a.n}</div><div class="desc">${SHORT[a.n]}</div></div>`).join('')}</div>
      </div></div>` },

  { id: 'v4b', title: 'V4b · 终端 · 放大版（新）', note: '命令行 20→27px、名字 25→29px、说明 15→19px 并改短；第 9 格从 coming_soon // TODO 改成「更多… // 还在路上」，不再像没写完。',
    html: () => `
      <div class="content">
        <div class="prompt"><span class="p">xueshi@mac</span> ~ <span class="c">$ open xueshi.dev</span><span class="cursor"></span></div>
        <div class="grid">${APPS.map(a => `<div class="cell">${icon(a)}<div><div class="name">${a.n}</div><div class="desc">// ${SHORT[a.n]}</div></div></div>`).join('')}<div class="cell more"><div class="ic"><div class="ph">+</div></div><div><div class="name">更多…</div><div class="desc">// 还在路上</div></div></div></div>
      </div>` },

  { id: 'v1', title: 'V1 · 极光壁纸', note: '最接近原图：紫粉渐变 + macOS 风格的波浪，3×3 九宫格，第 9 格放「更多…」占位，跟原图的 N____ / D____ 一个意思。',
    html: () => `
${WAVES}
      <div class="content"><div class="grid">
        ${APPS.map(a => `<div class="cell">${icon(a)}<div class="name">${a.n}</div></div>`).join('')}
        <div class="cell more"><div class="ic"><div class="ph">?</div></div><div class="name">更多…</div></div>
      </div></div>` },

  { id: 'v2', title: 'V2 · 夜色玻璃', note: '深色底 + 几团模糊色光，右侧一块毛玻璃卡片装 4×2 的应用，每个带一句中文说明。信息最全，适合点进主页的人一眼看懂你做什么。',
    html: () => `
      <div class="blob" style="left:520px;top:-120px;width:420px;height:320px;background:#4b3bff;opacity:.55"></div>
      <div class="blob" style="left:1050px;top:260px;width:460px;height:320px;background:#ff4f9a;opacity:.4"></div>
      <div class="blob" style="left:60px;top:300px;width:360px;height:260px;background:#1d6bff;opacity:.35"></div>
      <div class="content"><div class="card">
        <div class="head"><b>Mac 小工具，一个人做的</b><span>xueshi.dev</span></div>
        <div class="grid">${APPS.map(a => `<div class="cell">${icon(a)}<div><div class="name">${a.n}</div><div class="desc">${a.d}</div></div></div>`).join('')}</div>
      </div></div>` },

  { id: 'v3', title: 'V3 · 暖白纸面', note: '奶油色纸张 + 细颗粒，衬线标题，橙色点缀。克制、偏「独立开发者作品集」的气质，和深色头像对比强。',
    html: () => `
      <svg class="grain" width="1500" height="500"><filter id="n3"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .18 0"/></filter><rect width="1500" height="500" filter="url(#n3)"/></svg>
      <div class="rule"></div>
      <div class="content">
        <div class="head"><div class="t">Small tools, <i>made with care.</i></div><div class="u">xueshi.dev</div></div>
        <div class="grid">${APPS.map(a => `<div class="cell">${icon(a)}<div><div class="name">${a.n}</div><div class="desc">${a.d}</div></div></div>`).join('')}</div>
      </div>` },

  { id: 'v4', title: 'V4 · 终端', note: '黑底 + 细网格 + 等宽字体，顶上一行 `ls ~/Applications` 的命令提示符，说明写成代码注释。程序员味最重。',
    html: () => `
      <div class="content">
        <div class="prompt"><span class="p">xueshi@mac</span> ~ <span class="c">$ ls ~/Applications --xueshi.dev</span><span class="cursor"></span></div>
        <div class="grid">${APPS.map(a => `<div class="cell">${icon(a)}<div><div class="name">${a.n}</div><div class="desc">// ${a.d}</div></div></div>`).join('')}<div class="cell todo"><div class="ic"><div class="ph">+</div></div><div><div class="name" style="color:#6e7681">coming_soon</div><div class="desc">// TODO</div></div></div></div>
      </div>` },

  { id: 'v5', title: 'V5 · 大图标展台', note: '亮蓝渐变 + 顶部光束，只放大图标和名字（4×2），没有说明文字。图标本身最抢眼，远看也认得出。',
    html: () => `
      <div class="rays"></div>
      <div class="content"><div class="grid">${APPS.map(a => `<div class="cell">${icon(a)}<div class="name">${a.n}</div></div>`).join('')}</div></div>` },
];

const solo = new URLSearchParams(location.search).get('solo');
const list = document.getElementById('list');
const banner = v => `<div class="banner ${v.cls || v.id}">${v.html()}<div class="ghost"></div><div class="guide"><span>保留空白 0–445px</span></div></div>`;

if (solo) {
  // 导出模式：只渲染一张 1500×500，给无头浏览器截图用
  const v = V.find(x => x.id === solo);
  document.body.innerHTML = banner(v);
  document.body.style.background = 'transparent';
} else {
  list.innerHTML = V.map(v => `
    <section class="variant"><h2>${v.title}</h2><p>${v.note}</p>
      <div class="frame">${banner(v)}</div></section>`).join('');

  const AV = { cx: 216, cy: 497, r: 178 };   // 头像在 1500×500 坐标里的位置，从用户的 X 截图量的
  const xmock = (v, w) => { const k = w / 1500; return `
    <div class="xmock" style="width:${w}px"><div class="cap">${v.title.split('·')[0]}· ${w === 600 ? '电脑' : '手机'} ${w}px 宽</div>
      <div class="hb"><div class="clip" style="width:${w}px;height:${w/3}px"><div class="banner ${v.cls || v.id}" style="transform:scale(${k})">${v.html()}</div></div>
        <div class="av" style="left:${(AV.cx-AV.r)*k}px;top:${(AV.cy-AV.r)*k}px;width:${2*AV.r*k}px;height:${2*AV.r*k}px"></div></div>
      <div class="below" style="height:${AV.r*k + 10}px"></div></div>`; };
  const cmp = ['v2b', 'v2c', 'v4b', 'v4c'].map(id => V.find(v => v.id === id));
  list.insertAdjacentHTML('afterbegin', `<section class="variant"><h2>在 X 上的实际大小（按你截图里的比例和头像位置模拟）</h2>
    <p>X 电脑版头图显示约 600px 宽，手机约 390px 宽，也就是原图缩到 40% / 26%。左边是深色背景的放大版，右边是换成 V1 背景的。</p>
    ${[[cmp[0], cmp[1]], [cmp[2], cmp[3]]].map(pair => `<div class="xrow">${pair.map(v => xmock(v, 600)).join('')}${pair.map(v => xmock(v, 390)).join('')}</div>`).join('')}
  </section>`);
  const fit = () => document.querySelectorAll('.frame').forEach(f => {
    f.firstElementChild.style.transform = `scale(${f.clientWidth / 1500})`;
  });
  addEventListener('resize', fit); fit();
  const pick = document.getElementById('title-pick');
  pick.innerHTML = TITLES.map(t => `<option>${t}</option>`).join('');
  pick.onchange = () => document.querySelectorAll('.v2b .head b').forEach(b => b.textContent = pick.value);
  for (const k of ['guide'])
    document.getElementById('tg-' + k).onchange = e => document.body.classList.toggle('show-' + k, e.target.checked);
}
</script>
</body>
</html>
